<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stats card preview</title>
    <style>
      :root {
        --github-dark: #0d1117;
        --github-light: #ffffff;
        --toolbar-bg: #161b22;
        --toolbar-fg: #e6edf3;
        --toolbar-muted: #8b949e;
        --error: #f85149;
        --button-bg: #21262d;
        --button-border: #30363d;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica,
          Arial, sans-serif;
        background: var(--github-dark);
        color: var(--toolbar-fg);
      }

      header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        background: var(--toolbar-bg);
        font-size: 14px;
      }

      #status {
        color: var(--toolbar-muted);
      }

      #error {
        color: var(--error);
      }

      #error:empty {
        display: none;
      }

      .actions {
        display: flex;
        gap: 8px;
        margin-left: auto;
      }

      button {
        padding: 5px 12px;
        font: inherit;
        color: inherit;
        background: var(--button-bg);
        border: 1px solid var(--button-border);
        border-radius: 6px;
        cursor: pointer;
      }

      button:disabled {
        cursor: progress;
        opacity: 0.6;
      }

      section {
        padding: 32px 16px;
      }

      section.theme-dark {
        background: var(--github-dark);
      }

      section.theme-light {
        background: var(--github-light);
      }

      .cards {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 4px;
        max-width: 830px;
        margin: 0 auto;
      }

      .cards a {
        width: 49%;
      }

      .cards img {
        display: block;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <header>
      <span id="status">Loading…</span>
      <span id="error" role="alert"></span>
      <div class="actions">
        <button id="refresh" type="button">Refresh data</button>
        <button id="replay" type="button">Replay animation</button>
      </div>
    </header>
    <main id="sections"></main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>

<svg
  width="320"
  height="140"
  viewBox="0 0 320 140"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="titleId descId"
>
  <title id="titleId">Most Used Languages</title>
  <desc id="descId">TypeScript 70.42%, Mystery Lang 16.90%, Go 12.68%</desc>
  <style>
    .header {
      font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif;
      fill: #8839ef;
      animation: fadeInAnimation 0.8s ease-in-out forwards;
    }
    @supports(-moz-appearance: auto) {
      /* Selector detects Firefox */
      .header { font-size: 15.5px; }
    }
    @keyframes slideInAnimation {
      from {
        width: 0;
      }
      to {
        width: 270px;
      }
    }
    @keyframes growWidthAnimation {
      from {
        width: 0;
      }
      to {
        width: 100%;
      }
    }
    .stat {
      font: 600 14px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif; fill: #4c4f69;
    }
    @supports(-moz-appearance: auto) {
      /* Selector detects Firefox */
      .stat { font-size:12px; }
    }
    .bold { font-weight: 700 }
    .lang-name {
      font: 400 11px "Segoe UI", Ubuntu, Sans-Serif;
      fill: #4c4f69;
    }
    .stagger {
      opacity: 0;
      animation: fadeInAnimation 0.3s ease-in-out forwards;
    }
    #rect-mask rect{
      animation: slideInAnimation 1s ease-in-out forwards;
    }
    .lang-progress{
      animation: growWidthAnimation 0.6s ease-in-out forwards;
    }
    /* Animations */
    @keyframes scaleInAnimation {
      from {
        transform: translate(-5px, 5px) scale(0);
      }
      to {
        transform: translate(-5px, 5px) scale(1);
      }
    }
    @keyframes fadeInAnimation {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
      }
      .stagger {
        opacity: 1;
      }
    }
  </style>

  <rect
    data-testid="card-bg"
    x="0.5"
    y="0.5"
    rx="4.5"
    height="99%"
    stroke="#bcc0cc"
    width="319"
    fill="#1e1e2e00"
    stroke-opacity="1"
  />

  <g data-testid="card-title" transform="translate(25, 35)">
    <g transform="translate(0, 0)">
      <text x="0" y="0" class="header" data-testid="header">Most Used Languages</text>
    </g>
  </g>

  <g data-testid="main-card-body" transform="translate(0, 55)">
    <svg data-testid="lang-items" x="25">
    <mask id="rect-mask">
      <rect x="0" y="0" width="270" height="8" fill="white" rx="5"/>
    </mask>
    <rect
      mask="url(#rect-mask)"
      data-testid="lang-progress"
      x="0"
      y="0"
      width="190.14"
      height="8"
      fill="#3178c6"
    />
    <rect
      mask="url(#rect-mask)"
      data-testid="lang-progress"
      x="190.14"
      y="0"
      width="45.63"
      height="8"
      fill="#858585"
    />
    <rect
      mask="url(#rect-mask)"
      data-testid="lang-progress"
      x="235.76999999999998"
      y="0"
      width="34.23"
      height="8"
      fill="#00ADD8"
    />
    <g transform="translate(0, 25)">
    <g transform="translate(0, 0)"><g transform="translate(0, 0)">
      <g class="stagger" style="animation-delay: 450ms">
        <circle cx="5" cy="6" r="5" fill="#3178c6" />
        <text data-testid="lang-name" x="15" y="10" class="lang-name">TypeScript 70.42%</text>
      </g>
    </g><g transform="translate(0, 25)">
      <g class="stagger" style="animation-delay: 600ms">
        <circle cx="5" cy="6" r="5" fill="#858585" />
        <text data-testid="lang-name" x="15" y="10" class="lang-name">Mystery Lang 16.90%</text>
      </g>
    </g></g><g transform="translate(150, 0)"><g transform="translate(0, 0)">
      <g class="stagger" style="animation-delay: 450ms">
        <circle cx="5" cy="6" r="5" fill="#00ADD8" />
        <text data-testid="lang-name" x="15" y="10" class="lang-name">Go 12.68%</text>
      </g>
    </g></g>
    </g>
    </svg>
  </g>
</svg>

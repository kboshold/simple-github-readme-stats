<svg
  width="437"
  height="195"
  viewBox="0 0 437 195"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="titleId descId"
>
  <title id="titleId">Most Used Languages</title>
  <desc id="descId">TypeScript 45.87%, Rust 18.35%, Go 13.76%, Python 9.17%, Shell 4.59%, Lua 3.67%, Nix 2.75%, Kotlin 1.83%</desc>
  <style>
    .header {
      font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif;
      fill: #cba6f7;
      animation: fadeInAnimation 0.8s ease-in-out forwards;
    }
    @supports(-moz-appearance: auto) {
      /* Selector detects Firefox */
      .header { font-size: 15.5px; }
    }
    @keyframes slideInAnimation {
      from {
        width: 0;
      }
      to {
        width: 387px;
      }
    }
    @keyframes growWidthAnimation {
      from {
        width: 0;
      }
      to {
        width: 100%;
      }
    }
    .stat {
      font: 600 14px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif; fill: #cdd6f4;
    }
    @supports(-moz-appearance: auto) {
      /* Selector detects Firefox */
      .stat { font-size:12px; }
    }
    .bold { font-weight: 700 }
    .lang-name {
      font: 400 11px "Segoe UI", Ubuntu, Sans-Serif;
      fill: #cdd6f4;
    }
    .stagger {
      opacity: 0;
      animation: fadeInAnimation 0.3s ease-in-out forwards;
    }
    #rect-mask rect{
      animation: slideInAnimation 1s ease-in-out forwards;
    }
    .lang-progress{
      animation: growWidthAnimation 0.6s ease-in-out forwards;
    }
    /* Animations */
    @keyframes scaleInAnimation {
      from {
        transform: translate(-5px, 5px) scale(0);
      }
      to {
        transform: translate(-5px, 5px) scale(1);
      }
    }
    @keyframes fadeInAnimation {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
      }
      .stagger {
        opacity: 1;
      }
    }
  </style>

  <rect
    data-testid="card-bg"
    x="0.5"
    y="0.5"
    rx="4.5"
    height="99%"
    stroke="#45475a"
    width="436"
    fill="#1e1e2e00"
    stroke-opacity="1"
  />

  <g data-testid="card-title" transform="translate(25, 35)">
    <g transform="translate(0, 0)">
      <text x="0" y="0" class="header" data-testid="header">Most Used Languages</text>
    </g>
  </g>

  <g data-testid="main-card-body" transform="translate(0, 55)">
    <svg data-testid="lang-items" x="25">
    <mask id="rect-mask">
      <rect x="0" y="0" width="387" height="8" fill="white" rx="5"/>
    </mask>
    <rect
      mask="url(#rect-mask)"
      data-testid="lang-progress"
      x="0"
      y="0"
      width="177.52"
      height="8"
      fill="#3178c6"
    />
    <rect
      mask="url(#rect-mask)"
      data-testid="lang-progress"
      x="177.52"
      y="0"
      width="71.01"
      height="8"
      fill="#dea584"
    />
    <rect
      mask="url(#rect-mask)"
      data-testid="lang-progress"
      x="248.53000000000003"
      y="0"
      width="53.26"
      height="8"
      fill="#00ADD8"
    />
    <rect
      mask="url(#rect-mask)"
      data-testid="lang-progress"
      x="301.79"
      y="0"
      width="35.5"
      height="8"
      fill="#3572A5"
    />
    <rect
      mask="url(#rect-mask)"
      data-testid="lang-progress"
      x="337.29"
      y="0"
      width="17.75"
      height="8"
      fill="#89e051"
    />
    <rect
      mask="url(#rect-mask)"
      data-testid="lang-progress"
      x="355.04"
      y="0"
      width="14.2"
      height="8"
      fill="#000080"
    />
    <rect
      mask="url(#rect-mask)"
      data-testid="lang-progress"
      x="369.24"
      y="0"
      width="10.65"
      height="8"
      fill="#7e7eff"
    />
    <rect
      mask="url(#rect-mask)"
      data-testid="lang-progress"
      x="379.89"
      y="0"
      width="17.1"
      height="8"
      fill="#A97BFF"
    />
    <g transform="translate(0, 25)">
    <g transform="translate(0, 0)"><g transform="translate(0, 0)">
      <g class="stagger" style="animation-delay: 450ms">
        <circle cx="5" cy="6" r="5" fill="#3178c6" />
        <text data-testid="lang-name" x="15" y="10" class="lang-name">TypeScript 45.87%</text>
      </g>
    </g><g transform="translate(0, 25)">
      <g class="stagger" style="animation-delay: 600ms">
        <circle cx="5" cy="6" r="5" fill="#dea584" />
        <text data-testid="lang-name" x="15" y="10" class="lang-name">Rust 18.35%</text>
      </g>
    </g><g transform="translate(0, 50)">
      <g class="stagger" style="animation-delay: 750ms">
        <circle cx="5" cy="6" r="5" fill="#00ADD8" />
        <text data-testid="lang-name" x="15" y="10" class="lang-name">Go 13.76%</text>
      </g>
    </g><g transform="translate(0, 75)">
      <g class="stagger" style="animation-delay: 900ms">
        <circle cx="5" cy="6" r="5" fill="#3572A5" />
        <text data-testid="lang-name" x="15" y="10" class="lang-name">Python 9.17%</text>
      </g>
    </g></g><g transform="translate(194, 0)"><g transform="translate(0, 0)">
      <g class="stagger" style="animation-delay: 450ms">
        <circle cx="5" cy="6" r="5" fill="#89e051" />
        <text data-testid="lang-name" x="15" y="10" class="lang-name">Shell 4.59%</text>
      </g>
    </g><g transform="translate(0, 25)">
      <g class="stagger" style="animation-delay: 600ms">
        <circle cx="5" cy="6" r="5" fill="#000080" />
        <text data-testid="lang-name" x="15" y="10" class="lang-name">Lua 3.67%</text>
      </g>
    </g><g transform="translate(0, 50)">
      <g class="stagger" style="animation-delay: 750ms">
        <circle cx="5" cy="6" r="5" fill="#7e7eff" />
        <text data-testid="lang-name" x="15" y="10" class="lang-name">Nix 2.75%</text>
      </g>
    </g><g transform="translate(0, 75)">
      <g class="stagger" style="animation-delay: 900ms">
        <circle cx="5" cy="6" r="5" fill="#A97BFF" />
        <text data-testid="lang-name" x="15" y="10" class="lang-name">Kotlin 1.83%</text>
      </g>
    </g></g>
    </g>
    </svg>
  </g>
</svg>
